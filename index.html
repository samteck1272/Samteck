<!DOCTYPE html>
<html lang="om">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samteck — Computer Service</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<style>
  :root{
    --wine-950:#1c0606;
    --wine-900:#2c0909;
    --wine-800:#3d0d0d;
    --wine-700:#5c1414;
    --gold:#cf9f4f;
    --gold-soft:#e8c98a;
    --cream:#f4ece0;
    --cream-dim:#c9bbaa;
    --line: rgba(244,236,224,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(120% 60% at 50% -10%, #5a1616 0%, transparent 60%),
      linear-gradient(180deg, var(--wine-900) 0%, var(--wine-950) 40%, #120303 100%);
    color:var(--cream);
    font-family:'Manrope', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:0 0 64px;
  }
  .page{ width:100%; max-width:460px; padding:0; }
  .inner{padding:0 20px;}

  .hero{ text-align:center; margin-bottom:30px; }
  .hero-banner{
    position:relative; width:100%; height:400px; overflow:hidden;
    border-radius:0 0 32px 32px;
    box-shadow:0 20px 40px -20px rgba(0,0,0,0.7);
    background:var(--wine-800);
  }
  .hero-banner img{ width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block; }
  .hero-banner .fade{
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(28,6,6,0) 45%, rgba(20,5,5,0.75) 78%, var(--wine-950) 100%);
  }
  .hero-banner .overlay-text{ position:absolute; left:0; right:0; bottom:20px; text-align:center; }
  h1.name{
    font-family:'Fraunces', serif; font-weight:600; font-size:44px; letter-spacing:0.5px;
    margin:0; line-height:1; color:var(--cream); text-shadow:0 4px 18px rgba(0,0,0,0.5);
  }
  .tagline{
    font-family:'Fraunces', serif; font-style:italic; font-weight:500;
    color:var(--gold-soft); font-size:17px; margin:9px 0 0;
  }
  .locate{ font-size:13px; color:var(--cream-dim); margin:14px 0 0; text-align:center; }
  .locate svg{vertical-align:-2px; margin-right:4px;}

  .section-head{ display:flex; align-items:center; gap:12px; margin:34px 0 14px; }
  .section-head .rule{flex:1;height:1px;background:var(--line);}
  .section-head span{
    font-family:'Fraunces', serif; font-style:italic; font-size:15px; color:var(--gold-soft); white-space:nowrap;
  }

  .services{ display:flex; flex-direction:column; gap:10px; }
  .service{
    display:flex; align-items:center; gap:14px;
    background:linear-gradient(180deg, rgba(244,236,224,0.05), rgba(244,236,224,0.02));
    border:1px solid var(--line); border-radius:14px; padding:14px 16px;
  }
  .service .icon{
    width:38px;height:38px; flex:none; border-radius:10px;
    background:rgba(207,159,79,0.14); display:flex;align-items:center;justify-content:center;
  }
  .service .icon svg{width:19px;height:19px;stroke:var(--gold-soft);}
  .service p{ margin:0; font-size:14.5px; font-weight:600; color:var(--cream); line-height:1.3; }

  .links{ display:flex; flex-direction:column; gap:11px; }
  .link-card{
    display:flex; align-items:center; gap:14px;
    background:rgba(244,236,224,0.04); border:1px solid var(--line); border-radius:16px;
    padding:13px 16px; text-decoration:none; color:var(--cream);
    transition:background 0.15s ease, transform 0.15s ease;
  }
  .link-card:active{transform:scale(0.985);}
  .link-card:hover{background:rgba(244,236,224,0.08);}
  .link-card .icon{
    width:42px;height:42px; flex:none; border-radius:50%;
    display:flex;align-items:center;justify-content:center; background:var(--gold);
  }
  .link-card .icon svg{width:20px;height:20px;stroke:var(--wine-950);}
  .link-card .txt{flex:1; min-width:0;}
  .link-card .txt b{ display:block; font-size:15px; font-weight:700; }
  .link-card .txt span{
    display:block; font-size:12.5px; color:var(--cream-dim); margin-top:1px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .link-card .chev{flex:none; opacity:0.5;}

  footer{ text-align:center; margin-top:40px; font-size:12px; color:rgba(201,187,170,0.55); }
  footer a{ color:rgba(201,187,170,0.55); }

  .carousel{ position:relative; }
  .carousel-track{
    display:flex; gap:14px; overflow-x:auto; scroll-snap-type:x mandatory;
    padding-bottom:6px; -ms-overflow-style:none; scrollbar-width:none;
  }
  .carousel-track::-webkit-scrollbar{display:none;}
  .slide{
    scroll-snap-align:center; flex:0 0 78%;
    background:linear-gradient(180deg, rgba(244,236,224,0.06), rgba(244,236,224,0.02));
    border:1px solid var(--line); border-radius:18px; padding:22px 18px;
    display:flex; flex-direction:column; align-items:center; text-align:center; gap:10px;
  }
  .slide .icon{
    width:52px;height:52px; border-radius:50%; background:rgba(207,159,79,0.14);
    display:flex;align-items:center;justify-content:center; overflow:hidden;
  }
  .slide .icon img{ width:100%;height:100%;object-fit:cover; }
  .slide .icon svg{width:24px;height:24px;stroke:var(--gold-soft);}
  .slide b{font-size:15px; color:var(--cream);}
  .slide span{font-size:12.5px; color:var(--cream-dim); line-height:1.5;}
  .dots{display:flex; justify-content:center; gap:6px; margin-top:12px;}
  .dot{width:6px;height:6px;border-radius:50%; background:var(--line);}
  .dot.active{background:var(--gold);}
  .carousel-hint{ font-size:12px; color:var(--cream-dim); text-align:center; margin-top:10px; }
</style>
</head>
<body>
<div class="page">

  <div class="hero">
    <div class="hero-banner">
      <img id="heroImg" src="/images/uploads/hero.jpg" alt="Samteck">
      <div class="fade"></div>
      <div class="overlay-text">
        <h1 class="name" id="bizName">Samteck</h1>
        <p class="tagline" id="bizTagline">Computer Service</p>
      </div>
    </div>
    <p class="locate">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s7-7.16 7-12a7 7 0 1 0-14 0c0 4.84 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
      <span id="bizLocation">Shaggar city, Burayu &amp; surroundings, Finfine</span>
    </p>
  </div>

  <div class="inner">
    <div class="section-head"><div class="rule"></div><span>Tajaajila keenya</span><div class="rule"></div></div>
    <div class="services" id="servicesWrap"></div>

    <div class="section-head"><div class="rule"></div><span>Nu qunnamaa</span><div class="rule"></div></div>
    <div class="links" id="linksWrap"></div>

    <div class="section-head"><div class="rule"></div><span>Hojii dhiyeenya keenya</span><div class="rule"></div></div>
    <div class="carousel">
      <div class="carousel-track" id="track"></div>
      <div class="dots" id="dots"></div>
      <p class="carousel-hint">← Bitaa-mirgatti harkiisi, tokko tokkoon ilaali</p>
    </div>

    <footer>&copy; 2026 Samteck — Think it. See it. Live it. · <a href="/admin/">Admin</a></footer>
  </div>
</div>

<script>
  const SERVICE_ICONS = [
    '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg>',
    '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.1 2.1-2.6-.6-.6-2.6z"/></svg>',
    '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4.5 4.5 0 0 1-1-8.9A5.5 5.5 0 0 1 16.6 8 4 4 0 0 1 17 16H7z"/><path d="M12 12v6M9.5 15.5 12 18l2.5-2.5"/></svg>',
    '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="7" ry="2.5"/><path d="M5 5v6c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5V5M5 11v6c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5v-6"/></svg>',
    '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2.7"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l1.9-1.4-2-3.4-2.2.7a7.6 7.6 0 0 0-2.6-1.5L14.1 2h-4l-.4 2.9a7.6 7.6 0 0 0-2.6 1.5l-2.2-.7-2 3.4L4.6 10.5a7.6 7.6 0 0 0 0 3l-1.9 1.4 2 3.4 2.2-.7a7.6 7.6 0 0 0 2.6 1.5l.4 2.9h4l.4-2.9a7.6 7.6 0 0 0 2.6-1.5l2.2.7 2-3.4-1.9-1.4z"/></svg>',
    '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 15l1.5 1.5L15 12"/></svg>',
    '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="12" cy="9" r="2.3"/><path d="M8 17c.5-2 2-3 4-3s3.5 1 4 3"/></svg>'
  ];
  const PORTFOLIO_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>';

  async function loadJSON(path){
    try{
      const res = await fetch(path, {cache:"no-store"});
      if(!res.ok) throw new Error("missing");
      return await res.json();
    }catch(e){ return null; }
  }

  function esc(s){ return (s||"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  async function render(){
    const [settings, services, portfolio] = await Promise.all([
      loadJSON('/content/settings.json'),
      loadJSON('/content/services.json'),
      loadJSON('/content/portfolio.json')
    ]);

    if(settings){
      document.getElementById('bizName').textContent = settings.business_name || 'Samteck';
      document.getElementById('bizTagline').textContent = settings.tagline || '';
      document.getElementById('bizLocation').textContent = settings.location || '';
      if(settings.hero_image) document.getElementById('heroImg').src = settings.hero_image;
      document.title = (settings.business_name || 'Samteck') + ' — ' + (settings.tagline || '');

      const linksWrap = document.getElementById('linksWrap');
      const linkDefs = [];
      if(settings.phone1) linkDefs.push({
        href:`tel:${(settings.phone1||'').replace(/\s/g,'')}`,
        icon:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 3a2 2 0 0 1-.5 2.1L8 10a16 16 0 0 0 6 6l1.2-1.3a2 2 0 0 1 2.1-.5c1 .3 2 .5 3 .7a2 2 0 0 1 1.7 2z"/></svg>',
        title:'Bilbila', sub:[settings.phone1, settings.phone2].filter(Boolean).join(' · ')
      });
      if(settings.whatsapp) linkDefs.push({
        href:`https://wa.me/${settings.whatsapp}`, target:true,
        icon:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l1.4-4.2A9 9 0 1 1 8 19.5z"/><path d="M8.5 8.7c0 3.9 2.9 6.8 6.8 6.8.5 0 1-.4 1-1v-1l-2.3-.7-1 1a5.4 5.4 0 0 1-2.8-2.8l1-1-.7-2.3h-1c-.6 0-1 .5-1 1z"/></svg>',
        title:'WhatsApp', sub: settings.phone1 || settings.whatsapp
      });
      if(settings.telegram) linkDefs.push({
        href:`https://t.me/${settings.telegram}`, target:true,
        icon:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3 2 11l6 2m14-10-4 17-7-6m11-11-11 11"/></svg>',
        title:'Telegram', sub:'@'+settings.telegram
      });
      if(settings.instagram) linkDefs.push({
        href:`https://instagram.com/${settings.instagram}`, target:true,
        icon:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1"/></svg>',
        title:'Instagram', sub:'@'+settings.instagram
      });
      if(settings.facebook) linkDefs.push({
        href:`https://facebook.com/${settings.facebook}`, target:true,
        icon:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h-2a5 5 0 0 0-5 5v3H6v4h2v6h4v-6h3l1-4h-4V8a1 1 0 0 1 1-1h3z"/></svg>',
        title:'Facebook', sub:settings.facebook
      });
      if(settings.email) linkDefs.push({
        href:`mailto:${settings.email}`,
        icon:'<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
        title:'Email', sub:settings.email
      });
      linksWrap.innerHTML = linkDefs.map(l => `
        <a class="link-card" href="${l.href}" ${l.target?'target="_blank" rel="noopener"':''}>
          <div class="icon">${l.icon}</div>
          <div class="txt"><b>${esc(l.title)}</b><span>${esc(l.sub)}</span></div>
          <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
        </a>`).join('');
    }

    const servicesWrap = document.getElementById('servicesWrap');
    const svcItems = (services && services.items) || [];
    servicesWrap.innerHTML = svcItems.map((s,i) => `
      <div class="service">
        <div class="icon">${SERVICE_ICONS[i % SERVICE_ICONS.length]}</div>
        <p>${esc(s.text)}</p>
      </div>`).join('');

    const track = document.getElementById('track');
    const dotsWrap = document.getElementById('dots');
    const pfItems = (portfolio && portfolio.items) || [];
    track.innerHTML = pfItems.map(p => `
      <div class="slide">
        <div class="icon">${p.image ? `<img src="${esc(p.image)}" alt="">` : PORTFOLIO_ICON}</div>
        <b>${esc(p.title)}</b>
        <span>${esc(p.description)}</span>
      </div>`).join('');
    dotsWrap.innerHTML = pfItems.map((_,i) => `<div class="dot${i===0?' active':''}"></div>`).join('');
    const dots = dotsWrap.querySelectorAll('.dot');
    track.addEventListener('scroll', () => {
      const idx = Math.round(track.scrollLeft / (track.clientWidth * 0.78 + 14));
      dots.forEach((d,i) => d.classList.toggle('active', i===idx));
    }, {passive:true});
  }

  render();

  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", user => {
      if (!user) {
        window.netlifyIdentity.on("login", () => { document.location.href = "/admin/"; });
      }
    });
  }
</script>
</body>
</html>
